version: 2

models:
  - name: stg_pipedrive__deal_changes
    description: >
      Cleaned change log, one row per field change on a deal. Renamed and
      typed; new_value kept as text because it holds four field types.
    columns:
      - name: deal_id
        data_tests:
          - not_null
      - name: changed_field_key
        data_tests:
          - not_null
      - name: changed_at
        data_tests:
          - not_null

  - name: stg_pipedrive__activities
    description: >
      Cleaned activities, one row per activity. activity_id is not unique in the
      source (distinct activities share ids), so it is not tested for uniqueness.
    columns:
      - name: activity_id
        data_tests:
          - not_null
      - name: deal_id
        data_tests:
          - not_null

  - name: stg_pipedrive__stages
    description: One row per pipeline stage.
    columns:
      - name: stage_id
        data_tests:
          - unique
          - not_null

  - name: stg_pipedrive__activity_types
    description: One row per activity type, decoding type keys to names.
    columns:
      - name: activity_type_id
        data_tests:
          - unique
          - not_null

  - name: stg_pipedrive__users
    description: One row per user (sales rep).
    columns:
      - name: user_id
        data_tests:
          - unique
          - not_null

  - name: stg_pipedrive__fields
    description: One row per deal-field definition, including option JSON for categorical fields.
    columns:
      - name: field_id
        data_tests:
          - unique
          - not_null